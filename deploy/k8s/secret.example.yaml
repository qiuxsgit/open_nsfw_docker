# open-nsfw —— api-key Secret（示例，⚠️ 不要把真实 key 提交进 Git）
#
# src/app/config.py 在进程启动时读取 /py_config/password.txt，整个文件内容
# strip 后作为 api-key；deployment.yaml 把本 Secret 的 password.txt 挂到该路径。
#
# 推荐做法：不 apply 本文件，直接用命令行创建（key 不会进版本库、也不进 Jenkins 日志）
#
#   printf '你的真实key' > /tmp/password.txt
#   kubectl create secret generic open-nsfw-apikey -n apps \
#     --from-file=password.txt=/tmp/password.txt
#   shred -u /tmp/password.txt
#
# 轮换 key（改完 Secret 必须重启 Pod，因为 config.py 只在进程启动时读一次）：
#
#   printf '新key' > /tmp/password.txt
#   kubectl create secret generic open-nsfw-apikey -n apps \
#     --from-file=password.txt=/tmp/password.txt \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl rollout restart deployment/open-nsfw -n apps
#
# ⚠️ 用 printf 而不是 echo：echo 会多出换行，虽然 config.py 有 strip() 兜底，
#    但 printf 更不容易出意外。
apiVersion: v1
kind: Secret
metadata:
  name: open-nsfw-apikey
  namespace: apps
  labels:
    app: open-nsfw
type: Opaque
stringData:
  password.txt: "CHANGE_ME_BEFORE_APPLY"
